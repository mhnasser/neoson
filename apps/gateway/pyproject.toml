[project]
name = "neoson-gateway"
version = "0.1.0"
description = "Gateway HTTP do NeoSon."
authors = [{ name = "Mohamad Nasser" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.148.0",
    "neoson-contracts",
    "neoson-core",
    "uvicorn>=0.54.0",
]

[project.scripts]
neoson-gateway = "neoson_gateway.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
neoson-core = { workspace = true }
neoson-contracts = { workspace = true }
