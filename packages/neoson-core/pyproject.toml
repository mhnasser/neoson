[project]
name = "neoson-core"
version = "0.1.0"
description = "Motor do NeoSon: Agent Loop, roteamento, ferramentas, skills, memória e adaptadores."
authors = [{ name = "Mohamad Nasser" }]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx2>=2.14.0",
    "neoson-contracts",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
# Adaptador opcional do grafo; a instalação padrão e a Pi não instalam o driver.
neo4j = ["neo4j>=6.4,<7"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
neoson-contracts = { workspace = true }
