name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, mypy, Import Linter e pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Instalar Python (versão de .python-version)
        run: uv python install

      - name: Instalar workspace
        run: uv sync --locked --all-packages

      - name: Ruff (lint)
        run: uv run --locked --all-packages ruff check .

      - name: Ruff (formatação)
        run: uv run --locked --all-packages ruff format --check .

      - name: mypy
        run: uv run --locked --all-packages mypy

      - name: Import Linter
        run: uv run --locked --all-packages lint-imports

      - name: pytest
        run: uv run --locked --all-packages pytest
