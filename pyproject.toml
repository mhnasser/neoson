[project]
name = "neoson-workspace"
version = "0.1.0"
description = "Workspace do NeoSon: bibliotecas em packages/ e executáveis em apps/."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["neoson_contracts", "neoson_core", "neoson_gateway", "neoson_robot"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages", "apps", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["live: chama APIs reais; roda só com NEOSON_LIVE_TESTS=1"]

[tool.importlinter]
root_packages = ["neoson_contracts", "neoson_core", "neoson_gateway", "neoson_robot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Arquitetura em camadas"
type = "layers"
layers = ["neoson_gateway | neoson_robot", "neoson_core", "neoson_contracts"]

[[tool.importlinter.contracts]]
name = "Contratos independentes"
type = "forbidden"
source_modules = ["neoson_contracts"]
forbidden_modules = ["neoson_core", "neoson_gateway", "neoson_robot"]

[[tool.importlinter.contracts]]
name = "Raspberry isolada do servidor"
type = "forbidden"
source_modules = ["neoson_robot"]
forbidden_modules = ["neoson_core", "neoson_gateway"]

[[tool.importlinter.contracts]]
name = "Motor independente de transporte e infraestrutura"
type = "forbidden"
source_modules = ["neoson_core.engine"]
forbidden_modules = [
    "neoson_contracts",
    "neoson_core.infrastructure",
    "neoson_core.providers",
]

[[tool.importlinter.contracts]]
name = "SDK de fornecedor de LLM só em providers"
type = "forbidden"
source_modules = [
    "neoson_contracts",
    "neoson_gateway",
    "neoson_robot",
    "neoson_core.engine",
    "neoson_core.infrastructure",
    "neoson_core.routing",
]
forbidden_modules = ["openai"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Adaptadores independentes entre si"
type = "independence"
modules = ["neoson_core.providers", "neoson_core.routing", "neoson_core.memory"]

[[tool.importlinter.contracts]]
name = "Infraestrutura não depende de adaptadores"
type = "forbidden"
source_modules = ["neoson_core.infrastructure"]
forbidden_modules = [
    "neoson_core.memory",
    "neoson_core.providers",
    "neoson_core.routing",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
